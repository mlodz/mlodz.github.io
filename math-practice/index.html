<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Math Practice</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-title" content="Math">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6c4ee0">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple: #6c4ee0;
    --purple-dk: #5236c4;
    --bg: #f5f2ff;
    --card: #ffffff;
    --ink: #2a2350;
    --muted: #7a7299;
    --line: #e4defa;
    --green: #22b573;
    --red: #ef5a5a;
    --gold: #ffb627;
  }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100%;
  }

  body {
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  button {
    font-family: inherit;
    color: inherit;
    border: 0;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .screen { display: none; flex: 1; flex-direction: column; width: 100%; max-width: 480px; margin: 0 auto; padding: 20px 16px 24px; }
  .screen.active { display: flex; }

  /* ---------- Home ---------- */
  .hero {
    background: var(--purple);
    color: #fff;
    border-radius: 24px;
    padding: 28px 22px;
    text-align: center;
    margin-bottom: 20px;
    position: relative;
  }
  .hero h1 { font-size: 36px; font-weight: 700; line-height: 1.1; }
  .hero p { font-size: 18px; opacity: 0.85; margin-top: 6px; }
  .hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .stat {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 96px; padding: 12px 8px;
    background: rgba(255, 255, 255, 0.16); border-radius: 22px;
    color: #fff;
  }
  .stat:active { transform: scale(0.96); }
  .stat-row { display: flex; align-items: center; gap: 8px; }
  .stat-num { font-size: 44px; font-weight: 700; line-height: 1; }
  .stat-icon { font-size: 34px; line-height: 1; }
  .stat-label { font-size: 17px; opacity: 0.85; margin-top: 6px; }
  .section-label { font-size: 20px; font-weight: 600; color: var(--muted); margin: 0 4px 10px; }
  .sound-toggle {
    position: absolute; top: 10px; right: 10px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    font-size: 22px;
  }

  .levels { display: grid; gap: 12px; }

  .level {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    min-height: 64px;
    padding: 14px 18px;
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 18px;
    text-align: left;
    transition: transform 0.1s ease;
  }
  .level:active { transform: scale(0.97); }
  .level-name { font-size: 22px; font-weight: 600; }
  .level-example { font-size: 18px; color: var(--muted); white-space: nowrap; }
  .level-marker { width: 38px; display: flex; justify-content: center; flex-shrink: 0; font-size: 36px; line-height: 1; }
  .level .dot { width: 14px; height: 14px; border-radius: 50%; }
  .level-left { display: flex; align-items: center; gap: 12px; }
  .level-left > span:last-child { min-width: 0; }
  .level-best { display: block; font-size: 18px; letter-spacing: 2px; line-height: 1; margin-top: 2px; color: var(--line); }
  .level-best .earned { color: var(--gold); }
  .level-medal { display: block; margin-top: 3px; font-size: 16px; font-weight: 600; color: #b07a00; }
  .level-medal-next { display: block; font-size: 14px; color: var(--muted); }
  .level-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .level-tricky { font-size: 15px; font-weight: 600; color: #b07a00; white-space: nowrap; }

  .home-links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .home-link {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    min-height: 88px; padding: 12px 8px;
    background: #fff6dd; border: 3px solid #ffe4a1; border-radius: 18px;
    font-size: 20px; font-weight: 600;
  }
  .home-link:active { transform: scale(0.97); }
  .home-link .icon { font-size: 30px; line-height: 1; }
  .home-link .count-pill { font-size: 16px; color: #b07a00; }

  /* ---------- Sticker book + Activity ---------- */
  .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .page-head h2 { font-size: 30px; font-weight: 700; }
  .page-sub { color: var(--muted); font-size: 18px; margin-bottom: 16px; }

  .day-list { display: grid; gap: 10px; }
  .day-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px;
    background: var(--card); border: 3px solid var(--line); border-radius: 18px;
  }
  .day-name { font-size: 22px; font-weight: 600; }
  .day-rounds { font-size: 16px; color: var(--muted); }
  .day-stars { font-size: 26px; font-weight: 700; white-space: nowrap; }
  .info-link {
    display: block; margin: 20px auto 0; min-height: 44px; padding: 0 12px;
    background: none; color: var(--muted); font-size: 16px; text-decoration: underline;
  }
  .info-card {
    background: var(--card); border: 3px solid var(--line); border-radius: 18px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .info-card h3 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .info-card p, .info-card li { font-size: 18px; line-height: 1.45; }
  .info-card p + ul, .info-card ul + p { margin-top: 8px; }
  .info-card ul { padding-left: 22px; display: grid; gap: 6px; }
  .empty-note { text-align: center; color: var(--muted); font-size: 20px; padding: 40px 12px; }
  .book-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .book-tab {
    min-height: 44px; padding: 0 14px; border-radius: 999px;
    background: var(--card); border: 3px solid var(--line);
    font-size: 17px; font-weight: 600;
  }
  .book-tab.active { background: var(--purple); border-color: var(--purple); color: #fff; }
  .sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sticker-tile {
    aspect-ratio: 1; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 3px solid var(--line);
    font-size: 40px;
  }
  .sticker-tile.wiggle { animation: wiggle 0.5s ease-in-out; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0) scale(1); }
    25% { transform: rotate(-12deg) scale(1.15); }
    75% { transform: rotate(12deg) scale(1.15); }
  }
  .sticker-tile.missing { color: var(--line); font-size: 30px; font-weight: 700; background: transparent; border-style: dashed; }

  /* ---------- Quiz ---------- */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .quit {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--card); border: 3px solid var(--line);
    font-size: 20px; font-weight: 700; color: var(--muted);
    flex-shrink: 0;
  }
  .meter { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
  .meter span { height: 14px; border-radius: 7px; background: var(--line); transition: background 0.2s ease; }
  .meter span.right { background: var(--green); }
  .meter span.wrong { background: var(--gold); }
  .meter span.current { background: var(--purple); opacity: 0.45; }
  .count { text-align: center; color: var(--muted); font-size: 17px; margin-bottom: 8px; }

  .problem-card {
    background: var(--card);
    border-radius: 24px;
    border: 3px solid var(--line);
    padding: 24px 12px;
    text-align: center;
    margin-bottom: 14px;
  }
  .problem { font-size: clamp(48px, 15vw, 64px); font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .problem.story { font-size: 22px; font-weight: 600; line-height: 1.4; white-space: normal; text-align: left; padding: 0 8px; }
  .answer {
    display: inline-block;
    min-width: 2.2em;
    margin-top: 10px;
    padding: 2px 16px;
    font-size: clamp(48px, 15vw, 64px);
    font-weight: 700;
    line-height: 1.2;
    border-bottom: 5px solid var(--purple);
    color: var(--purple);
    min-height: 1.3em;
  }
  .answer.right { color: var(--green); border-color: var(--green); }
  .answer.wrong { color: var(--red); border-color: var(--red); animation: shake 0.35s; }
  .feedback { min-height: 30px; margin-top: 10px; font-size: 22px; font-weight: 600; }
  .feedback.right { color: var(--green); }
  .feedback.wrong { color: var(--red); }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: auto; }
  .key {
    height: 64px;
    border-radius: 16px;
    background: var(--card);
    border: 3px solid var(--line);
    font-size: 30px;
    font-weight: 600;
    transition: transform 0.08s ease;
  }
  .key:active { transform: scale(0.94); background: var(--line); }
  .key.back { color: var(--muted); font-size: 26px; }
  .key.go { background: var(--purple); border-color: var(--purple); color: #fff; font-size: 24px; }
  .key.go:active { background: var(--purple-dk); }
  .keypad.locked .key { pointer-events: none; opacity: 0.6; }

  /* ---------- Done ---------- */
  .done { justify-content: center; text-align: center; }
  .stars { font-size: 56px; letter-spacing: 4px; margin-bottom: 8px; }
  .star { display: inline-block; opacity: 0.18; filter: grayscale(1); }
  .star.earned { opacity: 1; filter: none; animation: pop 0.45s ease-out; }
  .medal-note { min-height: 30px; margin-bottom: 8px; font-size: 20px; font-weight: 600; color: #b07a00; line-height: 1.35; }
  .reward {
    visibility: hidden;
    background: #fff6dd; border: 3px solid #ffe4a1; border-radius: 20px;
    padding: 12px; margin-bottom: 16px;
  }
  .reward.shown { visibility: visible; animation: pop 0.5s ease-out; }
  .reward-label { font-size: 20px; font-weight: 600; color: #b07a00; }
  .reward-prize { font-size: 72px; line-height: 1.2; }
  .reward-note { font-size: 20px; font-weight: 600; color: var(--purple); }
  .reward-note:empty { display: none; }

  @keyframes pop {
    0% { transform: scale(0); }
    60% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .done h2 { font-size: 40px; font-weight: 700; }
  .done-message { font-size: 24px; font-weight: 600; color: var(--purple); margin-bottom: 20px; line-height: 1.25; }
  .score { font-size: 24px; color: var(--muted); margin: 8px 0 4px; }
  .done-total { font-size: 22px; font-weight: 600; margin-bottom: 10px; }
  .done-total .num { display: inline-block; }
  .done-total .num.bump { animation: pop 0.45s ease-out; }
  .big-btn {
    display: block; width: 100%;
    min-height: 60px; border-radius: 18px;
    font-size: 24px; font-weight: 600;
    margin-bottom: 12px;
  }
  .big-btn.primary { background: var(--purple); color: #fff; }
  .big-btn.secondary { background: var(--card); border: 3px solid var(--line); }
</style>
</head>
<body>

<section class="screen active" id="home">
  <div class="hero">
    <button class="sound-toggle" id="sound-toggle"></button>
    <h1>Math Practice</h1>
    <div class="hero-stats">
      <button class="stat" id="star-total-btn" aria-label="See my activity">
        <span class="stat-row">
          <span class="stat-num" id="star-total"></span>
          <span class="stat-icon" aria-hidden="true">⭐</span>
        </span>
        <span class="stat-label">stars earned ›</span>
      </button>
      <button class="stat" id="sticker-total-btn" aria-label="See my stickers">
        <span class="stat-row">
          <span class="stat-num" id="sticker-total"></span>
          <span class="stat-icon" id="sticker-total-icon" aria-hidden="true"></span>
        </span>
        <span class="stat-label">stickers earned ›</span>
      </button>
    </div>
  </div>
  <div class="section-label">Pick a level!</div>
  <div class="levels" id="levels"></div>
  <div class="home-links">
    <button class="home-link" id="sticker-book-btn"></button>
    <button class="home-link" id="activity-btn"></button>
  </div>
  <button class="info-link" id="info-btn">ℹ️ How it works</button>
</section>

<section class="screen" id="info">
  <div class="page-head">
    <button class="quit" id="info-back" aria-label="Back to levels">&times;</button>
    <h2>How it works</h2>
  </div>
  <div id="info-cards"></div>
</section>

<section class="screen" id="stickers">
  <div class="page-head">
    <button class="quit" id="book-back" aria-label="Back to levels">&times;</button>
    <h2>My Stickers</h2>
  </div>
  <div class="book-tabs" id="book-tabs"></div>
  <div class="page-sub" id="book-count"></div>
  <div class="sticker-grid" id="sticker-grid"></div>
</section>

<section class="screen" id="activity">
  <div class="page-head">
    <button class="quit" id="activity-back" aria-label="Back to levels">&times;</button>
    <h2>Activity</h2>
  </div>
  <div class="page-sub" id="activity-sub"></div>
  <div class="day-list" id="day-list"></div>
</section>

<section class="screen" id="quiz">
  <div class="topbar">
    <button class="quit" id="quit" aria-label="Back to levels">&times;</button>
    <div class="meter" id="meter"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="problem-card">
    <div class="problem" id="problem"></div>
    <div class="answer" id="answer"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="keypad" id="keypad"></div>
</section>

<section class="screen done" id="done">
  <div class="stars" id="stars"></div>
  <h2 id="done-title"></h2>
  <div class="score" id="score"></div>
  <div class="done-total">Total: <span class="num" id="done-total"></span> ⭐</div>
  <div class="medal-note" id="medal-note"></div>
  <div class="reward" id="reward">
    <div class="reward-label" id="reward-label"></div>
    <div class="reward-prize" id="reward-prize"></div>
    <div class="reward-note" id="reward-note"></div>
  </div>
  <div class="done-message" id="done-message"></div>
  <button class="big-btn primary" id="again">Play again</button>
  <button class="big-btn secondary" id="home-btn">Pick a level</button>
</section>

<script>
  const QUESTIONS_PER_SESSION = 10;
  const TRIES_PER_QUESTION = 2;
  const MAX_ANSWER_DIGITS = 3;
  const MAX_STARS = 3;
  const GOOD_ROUND_STARS = 2;
  const STICKER_CHANCE_ON_PERFECT = 0.5;
  const MAX_TRICKY_PER_ROUND = 4;
  const TRICKY_BEATEN_AFTER = 3; // first-try rights in a row
  const STORAGE_KEY = 'math-practice:v1';
  const MAX_SAVED_ROUNDS = 2000;

  // Filled in order: stickers come from the first book she hasn't finished. Saved data stores
  // only the emoji, so books can be added at the end, but an emoji must never be in two books.
  const STICKER_BOOKS = Object.freeze([
    { name: 'Animals', icon: '🐾', stickers: Object.freeze([
      '🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯',
      '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦', '🦄', '🐝',
      '🦋', '🐞', '🐢', '🐙', '🦑', '🦀', '🐠', '🐬', '🐳', '🦈',
      '🦒', '🐘', '🦔', '🦥', '🦦', '🦩', '🦚', '🦜', '🐉', '🦖',
    ]) },
    { name: 'Yummy Food', icon: '🍕', stickers: Object.freeze([
      '🍎', '🍌', '🍇', '🍓', '🍉', '🍊', '🍍', '🥭', '🍒', '🥝',
      '🍋', '🫐', '🥥', '🥕', '🌽', '🥦', '🥑', '🍅', '🥔', '🍕',
      '🍔', '🌭', '🌮', '🍟', '🍝', '🍣', '🍙', '🥟', '🥞', '🧇',
      '🥐', '🧀', '🍦', '🍩', '🍪', '🎂', '🧁', '🍫', '🍭', '🍿',
    ]) },
    { name: 'Space & Things That Go', icon: '🚀', stickers: Object.freeze([
      '🚀', '🛸', '🛰️', '🌍', '🌕', '🌙', '☀️', '🪐', '☄️', '🌌',
      '🔭', '🧑‍🚀', '🚗', '🚕', '🚌', '🏎️', '🚓', '🚑', '🚒', '🚐',
      '🛻', '🚚', '🚜', '🛺', '🛵', '🏍️', '🚲', '🛴', '🛹', '🚂',
      '🚄', '✈️', '🚁', '🎈', '🪂', '🚡', '🛶', '⛵', '🚤', '🚢',
    ]) },
  ]);

  const STICKERS = Object.freeze(STICKER_BOOKS.flatMap(book => book.stickers));

  function randInt(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }

  function nextTen(n) {
    return Math.ceil(n / 10) * 10;
  }

  // Each generator returns [a, b]; it retries until the pair fits the level's rule.
  function pairWhere(pick, fits) {
    for (;;) {
      const [a, b] = pick();
      if (fits(a, b)) return [a, b];
    }
  }

  function twoDigitNotEndingInZero(min, max) {
    return pairWhere(() => [randInt(min, max), 0], a => a % 10 !== 0)[0];
  }

  // `alias` is the level's permanent saved-data key and is never shown. Changing one orphans
  // that level's saved stars and round history, so rename `name` freely but leave `alias` alone.
  // Story templates, used in order. `{a}` / `{b}` insert a number. `{a:one|many}` inserts the number
  // followed by `one` when it is 1 and `many` otherwise, so verbs that agree go inside it too
  // ("{a:dragon is|dragons are}"). Only the two numbers can be 1; the question is always plural.
  const WINGS_OF_FIRE_STORIES = Object.freeze([
    "Clay ate {a:cow|cows} for breakfast. Then he ate {b:cow|cows} for lunch. How many cows did Clay eat?",
    "Starflight read {a:scroll|scrolls} on Monday. He read {b:more scroll|more scrolls} on Tuesday. How many scrolls did he read?",
    "{a:SkyWing flies|SkyWings fly} over the mountains. {b:SeaWing swims|SeaWings swim} below. How many dragons is that in all?",
    "Glory turned {a:scale|scales} purple. Then she turned {b:more scale|more scales} gold. How many scales changed color?",
    "{a:dragonet is|dragonets are} in the Jade Mountain library. {b:dragonet comes|dragonets come} in. How many dragonets are in the library now?",
    "Tsunami found {a:shell|shells} on the beach. Sunny found {b:shell|shells}. How many shells did they find together?",
    "Peril accidentally burned {a:scroll|scrolls} on Monday and {b:scroll|scrolls} on Tuesday. How many scrolls did Peril burn?",
    "Kinkajou ate {a:mango|mangoes} and {b:banana|bananas}. How many pieces of fruit did she eat?",
    "Qibli has {a:gold coin|gold coins} in his pouch. He finds {b:more coin|more coins}. How many coins does Qibli have now?",
    "Sunny saw {a:shooting star|shooting stars} last night and {b:shooting star|shooting stars} tonight. How many shooting stars did she see?",
    "{a:RainWing is|RainWings are} napping in the sun. {b:more RainWing joins|more RainWings join} the nap. How many RainWings are napping now?",
    "Moon picked {a:flower|flowers} in the rainforest. Then she picked {b:more flower|more flowers}. How many flowers did Moon pick?",
    "Winter caught {a:fish|fish} in the icy sea. Then he caught {b:more fish|more fish}. How many fish did Winter catch?",
    "Turtle swam {a:lap|laps} around the lake in the morning and {b:lap|laps} in the afternoon. How many laps did Turtle swim?",
    "Clay rolled in the mud {a:time|times} before lunch and {b:time|times} after lunch. How many times did Clay roll in the mud?",
    "A MudWing has {a:ruby|rubies} and {b:emerald|emeralds} in a treasure pile. How many gems are in the pile?",
    "{a:IceWing is|IceWings are} sliding on the ice. {b:more IceWing starts|more IceWings start} sliding too. How many IceWings are sliding?",
    "Blue spun {a:silk thread|silk threads} in the morning. He spun {b:more thread|more threads} at night. How many threads did Blue spin?",
    "Cricket read {a:book|books} last week and {b:book|books} this week. How many books did Cricket read?",
    "Sundew planted {a:seed|seeds} in the morning and {b:seed|seeds} in the afternoon. How many seeds did Sundew plant?",
    "{a:SilkWing flutters|SilkWings flutter} above the treetops. {b:more SilkWing flies|more SilkWings fly} up. How many SilkWings are flying now?",
    "Swordtail did {a:flip|flips} in the air. Then he did {b:more flip|more flips}. How many flips did Swordtail do?",

  function problemKey([a, b]) {
    return `${a}+${b}`;
  }

  function pairFromKey(key) {
    return key.split('+').map(Number);
  }

  function shuffled(list) {
    const copy = [...list];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = randInt(0, i);
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Tricky facts she has missed come back first, then random problems fill the round.
  function makeSession(level, trickyKeys) {
    const problems = shuffled(trickyKeys).slice(0, MAX_TRICKY_PER_ROUND).map(pairFromKey);
    const seen = new Set(problems.map(problemKey));
    for (let attempts = 0; problems.length < QUESTIONS_PER_SESSION; attempts++) {
      const pair = level.make();
      const allowRepeat = attempts > 500; // tiny levels may not have 10 distinct problems
      if (seen.has(problemKey(pair)) && !allowRepeat) continue;
      seen.add(problemKey(pair));
      problems.push(pair);
    }
    return shuffled(problems);
  }

  function longestRightRun(results) {
    let longest = 0;
    let current = 0;
    for (const result of results) {
      current = result === 'right' ? current + 1 : 0;
      longest = Math.max(longest, current);
    }
    return longest;
  }

  function localDay(date) {

    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;

  function levelRecord(rounds, levelAlias) {
    const record = { goodRounds: 0, perfectRounds: 0, currentRunAfterGold: 0, longestRunAfterGold: 0 };
    for (const round of rounds) {
      if (round.level !== levelAlias) continue;
      const isPerfect = round.stars === MAX_STARS;
      const hadGold = record.perfectRounds >= GOLD_PERFECT_ROUNDS;
      if (round.stars >= GOOD_ROUND_STARS) record.goodRounds++;
      if (isPerfect) record.perfectRounds++;
      if (hadGold) {
        record.currentRunAfterGold = isPerfect ? record.currentRunAfterGold + 1 : 0;
        record.longestRunAfterGold = Math.max(record.longestRunAfterGold, record.currentRunAfterGold);
      }
    }
    return record;
  }

  function medalsEarnedBy(record) {
    let earned = 0;
    while (earned < MEDALS.length && MEDALS[earned].countToEarn(record) >= MEDALS[earned].goal) earned++;

  // Pentatonic, so any random walk over it sounds pleasant.
  const JINGLE_SCALE = Object.freeze([523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51]);

  // Small seeded random-number generator (mulberry32), so a sticker plays the same jingle every time.
  function seededRandom(seed) {
    let a = seed;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // FNV-1a, a tiny string hash: turns an emoji into a stable number.
  function hashText(text) {
    let hash = 0x811c9dc5;
    for (let i = 0; i < text.length; i++) {
      hash ^= text.charCodeAt(i);
      hash = Math.imul(hash, 0x01000193);
    }
    return hash >>> 0;
  }

  // Seeded by the emoji itself, so a sticker keeps its jingle wherever it sits in STICKER_BOOKS.
  // The salt was picked so every current sticker gets different notes; recheck when adding a book.
  const JINGLE_SALT = 's211';

  const NOTE_HZ = Object.freeze({
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392, 'G#4': 415.3, A4: 440, 'A#4': 466.16, B4: 493.88,
    C5: 523.25, D5: 587.33, 'D#5': 622.25, E5: 659.25, F5: 698.46, 'F#5': 739.99, G5: 783.99, 'G#5': 830.61,
    C6: 1046.5,
  });

  // `melody` is space-separated `note:beats`, e.g. 'D4:1 F4:1 D5:3'.
  function tune(secondsPerBeat, melody) {
    let start = 0;
    return melody.split(' ').map(token => {
      const [name, beats] = token.split(':');
      const length = Number(beats) * secondsPerBeat;
      const note = [NOTE_HZ[name], start, length * 0.9];
      start += length;
      return note;
    });
  }

  const SPECIAL_JINGLES = Object.freeze({

    '🐸': tune(0.14, 'D4:1 F4:1 D5:3 D4:1 F4:1 D5:3 E5:2 F5:1 E5:1 F5:1 E5:1 C5:1 A4:3'), // Song of Storms
    '🦋': tune(0.15, 'F4:1 A4:1 B4:2 F4:1 A4:1 B4:2 F4:1 A4:1 B4:1 E5:1 D5:2'), // Saria's Song
    '🦈': tune(0.2, 'A4:1 A#4:1 B4:1 C5:4'), // treasure chest item fanfare

  function jingleFor(sticker) {
    if (sticker in SPECIAL_JINGLES) return SPECIAL_JINGLES[sticker];
    const random = seededRandom(hashText(JINGLE_SALT + sticker));
    const noteCount = 4 + Math.floor(random() * 3);
    let step = Math.floor(random() * JINGLE_SCALE.length);
    let start = 0;
    const notes = [];
    for (let i = 0; i < noteCount; i++) {
      const isLast = i === noteCount - 1;
      const duration = isLast ? 0.4 : random() < 0.5 ? 0.12 : 0.22;
      notes.push([JINGLE_SCALE[step], start, duration]);
      start += duration * 0.85;
      const move = (random() < 0.5 ? -1 : 1) * (1 + Math.floor(random() * 2));
      step = Math.min(JINGLE_SCALE.length - 1, Math.max(0, step + move));
    }
    return notes;
  }

  function ownedCountIn(book, owned) {
    return book.stickers.filter(sticker => owned.includes(sticker)).length;
  }

  function isBookFull(book, owned) {
    return ownedCountIn(book, owned) === book.stickers.length;
  }

  // The book she is filling now; null once every book is full.
  function currentBookFor(owned) {
    return STICKER_BOOKS.find(book => !isBookFull(book, owned)) ?? null;
  }

  function bookOf(sticker) {
    return STICKER_BOOKS.find(book => book.stickers.includes(sticker));
  }

  // A medal round pays out the medal, never a sticker as well.
  function winsSticker({ isFirstFinishOnLevel, stars, wonMedal }) {
    if (wonMedal) return false;
    if (isFirstFinishOnLevel) return true;
    return stars === MAX_STARS && Math.random() < STICKER_CHANCE_ON_PERFECT;
  }

  function pickSticker(owned) {
    const book = currentBookFor(owned);
    const pool = book ? book.stickers.filter(sticker => !owned.includes(sticker)) : STICKERS;
    return pool[randInt(0, pool.length - 1)];
  }

  // Saved shape (bump `schemaVersion` and migrate in loadProgress if this changes incompatibly):
  //   totalStars: all-time stars; kept as a counter because `rounds` gets trimmed
  //   days:      { 'YYYY-MM-DD' local: { stars, rounds } }; never trimmed, ~40 bytes a day
  //   bestStars: { [level alias]: 1–3 }
  //   stickers:  emoji in the order earned
  //   rounds:    oldest first, capped at MAX_SAVED_ROUNDS —
  //              { day: 'YYYY-MM-DD' local, finishedAt: epoch ms, level: alias,
  //                stars, firstTryCorrect, longestRun, sticker (null when none was won), isNewSticker }
  //   medals:    { [level alias]: medals earned, 0–4 }; only goes up, so trimming `rounds` can't take one away
  //   trickyFacts: { [level alias]: { 'a+b': first-try rights since her last miss } };
  //              a fact is removed once that reaches TRICKY_BEATEN_AFTER
  //   storyCursor: { [level alias]: stories used so far }; next story is cursor % length
  //   messageCursor: { silly, growth }: rounds that have used each set; next line is cursor % length
  //   soundOn:   boolean
  function loadProgress() {
    const fresh = { schemaVersion: 1, totalStars: 0, days: {}, bestStars: {}, stickers: [], rounds: [], medals: {}, trickyFacts: {}, storyCursor: {}, messageCursor: { silly: 0, growth: 0 }, soundOn: true };
    try {
      return { ...fresh, ...JSON.parse(localStorage.getItem(STORAGE_KEY)) };
    } catch {
      return fresh;
    }
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    } catch {}
  }

  const progress = loadProgress();

  function medalsEarnedOn(levelAlias) {
    const record = levelRecord(progress.rounds, levelAlias);
    return Math.max(progress.medals[levelAlias] ?? 0, medalsEarnedBy(record));
  }

  function trickyKeysFor(levelAlias) {
    return Object.keys(progress.trickyFacts[levelAlias] ?? {});
  }

  // Returns how many tricky facts she beat this round.
  function updateTrickyFacts(levelAlias, problems, results) {
    const tricky = progress.trickyFacts[levelAlias] ?? {};
    let beaten = 0;
    problems.forEach(({ a, b }, i) => {
      const key = problemKey([a, b]);
      if (results[i] !== 'right') {
        tricky[key] = 0;
      } else if (key in tricky) {
        tricky[key]++;
        if (tricky[key] >= TRICKY_BEATEN_AFTER) {
          delete tricky[key];
          beaten++;
        }
      }
    });
    progress.trickyFacts[levelAlias] = tricky;
    return beaten;
  }

  function recordRound(level, problems, results) {
    const levelAlias = level.alias;
    const medalsBefore = medalsEarnedOn(levelAlias);
    const firstTryCorrect = results.filter(r => r === 'right').length;
    const stars = starsFor(firstTryCorrect);
    // bestStars gets an entry on a level's first finished round and is never trimmed.
    const isFirstFinishOnLevel = !(levelAlias in progress.bestStars);
    const previousBest = progress.bestStars[levelAlias] ?? 0;
    const messageSet = messageSetFor(stars);
    const messages = MESSAGE_SETS[messageSet];
    const cursor = progress.messageCursor[messageSet] ?? 0;
    const message = messages[cursor % messages.length];
    const now = new Date();
    const day = localDay(now);
    const dayTotals = progress.days[day] ?? { stars: 0, rounds: 0 };

    progress.totalStars += stars;
    progress.days[day] = { stars: dayTotals.stars + stars, rounds: dayTotals.rounds + 1 };
    if (stars > previousBest) progress.bestStars[levelAlias] = stars;
    progress.messageCursor[messageSet] = cursor + 1;
    const roundEntry = {
      day,
      finishedAt: now.getTime(),
      level: levelAlias,
      stars,
      firstTryCorrect,
      longestRun: longestRightRun(results),
      sticker: null,
      isNewSticker: false,
    };
    progress.rounds.push(roundEntry);
    progress.rounds = progress.rounds.slice(-MAX_SAVED_ROUNDS);

    // Medals are counted with this round included, and decide whether a sticker is won.
    const medalsAfter = medalsEarnedOn(levelAlias);
    progress.medals[levelAlias] = medalsAfter;
    const wonMedal = medalsAfter > medalsBefore;
    const sticker = winsSticker({ isFirstFinishOnLevel, stars, wonMedal }) ? pickSticker(progress.stickers) : null;
    const isNewSticker = sticker !== null && !progress.stickers.includes(sticker);
    if (isNewSticker) progress.stickers.push(sticker);
    Object.assign(roundEntry, { sticker, isNewSticker });
    const filledBook = isNewSticker && isBookFull(bookOf(sticker), progress.stickers) ? bookOf(sticker) : null;
    const trickyBeaten = updateTrickyFacts(levelAlias, problems, results);
    saveProgress();
    return {
      firstTryCorrect,
      stars,
      sticker,
      isNewSticker,
      filledBook,
      openedBook: filledBook ? currentBookFor(progress.stickers) : null,
      message,
      newMedal: wonMedal ? MEDALS[medalsAfter - 1] : null,
      medalGoal: nextMedalGoal(medalsAfter, level.name),
      trickyBeaten,
    };
  }

  // ---------- Sound (synthesized, so there are no audio files to load) ----------

  // Each note is [frequencyHz, startSec, durationSec].
  const SOUNDS = Object.freeze({
    right: [[880, 0, 0.15], [1318.5, 0.08, 0.3]],
    wrong: [[220, 0, 0.18], [185, 0.12, 0.25]],
    star1: [[659.25, 0, 0.35]],
    star2: [[783.99, 0, 0.35]],
    star3: [[1046.5, 0, 0.45]],
    fanfare: [[523.25, 0, 0.15], [659.25, 0.12, 0.15], [783.99, 0.24, 0.15], [1046.5, 0.36, 0.7]],
    sticker: [[1046.5, 0, 0.12], [1318.5, 0.1, 0.12], [1568, 0.2, 0.4]],
    medal: [[783.99, 0, 0.12], [987.77, 0.1, 0.12], [1174.66, 0.2, 0.12], [1567.98, 0.3, 0.8]],
  });

  let audioCtx = null;

  // iOS only lets audio start from inside a user gesture, so this runs on every tap.
  function unlockAudio() {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    audioCtx ??= new AudioContextClass();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(name) {
    playNotes(SOUNDS[name]);
  }

  function playNotes(notes) {
    if (!progress.soundOn || !audioCtx) return;
    const now = audioCtx.currentTime;
    for (const [freq, start, duration] of notes) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + start);
      gain.gain.exponentialRampToValueAtTime(0.3, now + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + start + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + start);
      osc.stop(now + start + duration + 0.05);
    }
  }

  const CONFETTI_SRC = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js';

  // Fetched when the first round starts, not at page load, so it never delays the first paint.
  function loadConfetti() {
    if (document.querySelector(`script[src="${CONFETTI_SRC}"]`)) return;
    const script = document.createElement('script');
    script.src = CONFETTI_SRC;
    script.defer = true;
    document.head.appendChild(script);
  }

  function fireConfetti(stars) {
    if (!window.confetti) return; // still loading, or CDN unavailable offline
    const burst = { particleCount: 50 * stars, spread: 60 + 25 * stars, origin: { y: 0.55 }, disableForReducedMotion: true };
    confetti(burst);
    if (stars === MAX_STARS) {
      confetti({ ...burst, angle: 60, origin: { x: 0, y: 0.7 } });
      confetti({ ...burst, angle: 120, origin: { x: 1, y: 0.7 } });
    }
  }

  const CHEERS = ['Great job!', 'You got it!', 'Awesome!', 'Nice!', 'Super!', 'Yes!'];
  const DONE_TITLES = { 3: 'Perfect!', 2: 'Great work!', 1: 'Good practice!' };

  const $ = id => document.getElementById(id);

  const ui = {
    screens: { home: $('home'), stickers: $('stickers'), activity: $('activity'), info: $('info'), quiz: $('quiz'), done: $('done') },
    meter: $('meter'),
    count: $('count'),
    problem: $('problem'),
    answer: $('answer'),
    feedback: $('feedback'),
    keypad: $('keypad'),
  };

  const state = {
    level: null,
    problems: [],
    index: 0,
    typed: '',
    triesLeft: TRIES_PER_QUESTION,
    results: [], // 'right' | 'wrong' per finished question
    locked: false,
    pendingTimer: null,
  };

  function later(fn, delayMs) {
    clearTimeout(state.pendingTimer);
    state.pendingTimer = setTimeout(fn, delayMs);
  }

  function show(name) {
    for (const [key, el] of Object.entries(ui.screens)) el.classList.toggle('active', key === name);
    window.scrollTo(0, 0);
  }

  function bestStarsHtml(best) {
    let html = '';
    for (let i = 0; i < MAX_STARS; i++) html += `<span class="${i < best ? 'earned' : ''}">★</span>`;
    return html;
  }

  // Her latest medal stands in for the level's colored dot once she has one.
  function levelMarkerHtml(level) {
    const earned = medalsEarnedOn(level.alias);
    if (earned) return MEDALS[earned - 1].icon;
    return `<span class="dot" style="background:${level.color}"></span>`;
  }

  // Best stars until she earns a medal, then the medal she has and the name of the next one.
  function levelProgressHtml(level) {
    const earned = medalsEarnedOn(level.alias);
    if (!earned) {
      const best = progress.bestStars[level.alias] ?? 0;
      const stars = `<span class="level-best" aria-label="Best: ${best} stars">${bestStarsHtml(best)}</span>`;
      const hasPlayed = best > 0;
      return hasPlayed ? `${stars}<span class="level-medal-next">${nextMedalGoal(0, level.name)}</span>` : stars;
    }
    const medal = MEDALS[earned - 1];
    const nextGoal = earned === MEDALS.length ? "You've mastered this level!" : nextMedalGoal(earned, level.name);
    return `
      <span class="level-medal">You have a ${medal.name} medal</span>
      <span class="level-medal-next">${nextGoal}</span>`;
  }

  function renderLevels() {
    const list = $('levels');
    list.innerHTML = '';
    LEVELS.forEach(level => {
      const trickyCount = trickyKeysFor(level.alias).length;
      const btn = document.createElement('button');
      btn.className = 'level';
      btn.innerHTML = `
        <span class="level-left">
          <span class="level-marker">${levelMarkerHtml(level)}</span>
          <span>
            <span class="level-name">${level.name}</span>
            ${levelProgressHtml(level)}
          </span>
        </span>
        <span class="level-right">
          <span class="level-example">${level.example}</span>
          ${trickyCount ? `<span class="level-tricky">💪 ${trickyCount} tricky</span>` : ''}
        </span>`;
      btn.addEventListener('click', () => startSession(level));
      list.appendChild(btn);
    });
  }

  function renderSoundToggle() {
    const btn = $('sound-toggle');
    btn.textContent = progress.soundOn ? '🔊' : '🔇';
    btn.setAttribute('aria-label', progress.soundOn ? 'Turn sound off' : 'Turn sound on');
  }

  function currentBookCountText() {
    const book = currentBookFor(progress.stickers);
    if (!book) return plural(progress.stickers.length, 'sticker');
    return `${ownedCountIn(book, progress.stickers)} of ${book.stickers.length}`;
  }

  function plural(count, word) {
    return `${count} ${word}${count === 1 ? '' : 's'}`;
  }

  function renderHome() {
    renderLevels();
    renderSoundToggle();
    $('star-total').textContent = progress.totalStars;
    $('sticker-total').textContent = progress.stickers.length;
    $('sticker-total-icon').textContent = progress.stickers.at(-1) ?? '📒';
    $('sticker-book-btn').innerHTML =
      `<span class="icon">📒</span><span>My Stickers</span><span class="count-pill">${currentBookCountText()}</span>`;
    const daysPlayed = Object.keys(progress.days).length;
    $('activity-btn').innerHTML =
      `<span class="icon">📅</span><span>Activity</span><span class="count-pill">${plural(daysPlayed, 'day')}</span>`;
  }

  function goHome() {
    clearTimeout(state.pendingTimer);
    renderHome();
    show('home');
  }

  // Finished books plus the one she is filling; later books are shown locked.
  function openBooks() {
    const current = currentBookFor(progress.stickers);
    return current ? STICKER_BOOKS.slice(0, STICKER_BOOKS.indexOf(current) + 1) : STICKER_BOOKS;
  }

  function renderBookTabs(selected) {
    const tabs = $('book-tabs');
    tabs.innerHTML = '';
    const open = openBooks();
    for (const book of STICKER_BOOKS) {
      const tab = document.createElement('button');
      tab.className = book === selected ? 'book-tab active' : 'book-tab';
      tab.textContent = open.includes(book) ? `${book.icon} ${book.name}` : `🔒 ${book.name}`;
      tab.addEventListener('click', () => showStickerBook(book));
      tabs.appendChild(tab);
    }
  }

  function showStickerBook(book = openBooks().at(-1)) {
    renderBookTabs(book);
    const grid = $('sticker-grid');
    grid.innerHTML = '';
    for (const sticker of book.stickers) {
      const owned = progress.stickers.includes(sticker);
      const tile = document.createElement(owned ? 'button' : 'div');
      tile.className = owned ? 'sticker-tile' : 'sticker-tile missing';
      tile.textContent = owned ? sticker : '?';
      if (owned) {
        tile.setAttribute('aria-label', `Play ${sticker}'s song`);
        tile.addEventListener('click', () => playStickerJingle(tile, sticker));
      }
      grid.appendChild(tile);
    }
    const ownedHere = ownedCountIn(book, progress.stickers);
    const tapHint = ownedHere ? ' Tap one to hear its song!' : '';
    const bookBefore = STICKER_BOOKS[STICKER_BOOKS.indexOf(book) - 1];
    $('book-count').textContent = openBooks().includes(book)
      ? `${book.icon} ${book.name}: ${ownedHere} of ${book.stickers.length}.${tapHint}`
      : `🔒 Fill the ${bookBefore.name} book to open this one!`;
    show('stickers');
  }

  // Parsed as local midnight; `new Date('YYYY-MM-DD')` would be UTC and can land on the wrong day.
  function dateFromDay(day) {
    const [y, m, d] = day.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function dayLabel(day, today) {
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    if (day === localDay(today)) return 'Today';
    if (day === localDay(yesterday)) return 'Yesterday';
    return dateFromDay(day).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  // Written for her to read. Medal icons stay hidden here too: she sees each one only once she earns it.
  function showInfo() {
    const listItems = items => items.map(item => `<li>${item}</li>`).join('');
    const medalRules = MEDALS.map(medal => `<b>${medal.name}:</b> ${medal.howToEarn(medal.goal)}`);
    $('info-cards').innerHTML = `
      <section class="info-card">
        <h3>⭐ Stars</h3>
        <ul>${listItems([
          `All ${QUESTIONS_PER_SESSION} right on your first try: ⭐⭐⭐`,
          `${TWO_STARS_AT} or more right on your first try: ⭐⭐`,
          'Less than that: ⭐. Every round gets at least one star!',
          'You win a sticker the first time you finish a level.',
          'After that, every ⭐⭐⭐ round has a chance to win a sticker!',
          'If you win a medal, you get the medal instead of a sticker.',
          'Fill up a sticker book to open the next one.',
        ])}</ul>
      </section>
      <section class="info-card">
        <h3>🏆 Medals</h3>
        <p>Every level has its own medals. You win them one at a time, in this order:</p>
        <ul>${listItems(medalRules)}</ul>
        <p>Once you win a medal, it's yours forever!</p>
      </section>
      <section class="info-card">
        <h3>💪 Tricky ones</h3>
        <ul>${listItems([
          'If you get a problem wrong, or need a second try, it becomes a tricky one.',
          'Tricky ones come back in your next rounds. Look for "💪 Tricky one!" at the top.',
          `Get it right on your first try ${TRICKY_BEATEN_AFTER} times in a row, and you beat it!`,
          "Missed it again? That's okay. It just stays tricky a little longer.",
          'The 💪 number on a level shows how many tricky ones are left.',
        ])}</ul>
      </section>`;
    show('info');
  }

  function showActivity() {
    const list = $('day-list');
    list.innerHTML = '';
    // 'YYYY-MM-DD' sorts chronologically as plain text.
    const days = Object.keys(progress.days).sort().reverse();
    const today = new Date();
    for (const day of days) {
      const { stars, rounds } = progress.days[day];
      const row = document.createElement('div');
      row.className = 'day-row';
      row.innerHTML = `
        <div>
          <div class="day-name">${dayLabel(day, today)}</div>
          <div class="day-rounds">${plural(rounds, 'round')}</div>
        </div>
        <div class="day-stars">${stars} ⭐</div>`;
      list.appendChild(row);
    }
    if (!days.length) list.innerHTML = '<div class="empty-note">No rounds yet. Pick a level to start!</div>';
    $('activity-sub').textContent = `${plural(progress.totalStars, 'star')} on ${plural(days.length, 'day')}`;
    show('activity');
  }

  function playStickerJingle(tile, sticker) {
    playNotes(jingleFor(sticker));
    tile.classList.remove('wiggle');
    void tile.offsetWidth; // restart the animation on repeat taps
    tile.classList.add('wiggle');
  }

  function toggleSound() {
    progress.soundOn = !progress.soundOn;
    saveProgress();
    renderSoundToggle();
    playSound('right');
  }

  function renderKeypad() {
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'back', '0', 'go'];
    keys.forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'key';
      if (key === 'back') { btn.classList.add('back'); btn.textContent = '⌫'; btn.setAttribute('aria-label', 'Delete'); }
      else if (key === 'go') { btn.classList.add('go'); btn.textContent = 'Check'; }
      else btn.textContent = key;
      btn.addEventListener('click', () => pressKey(key));
      ui.keypad.appendChild(btn);
    });
  }

  function renderMeter() {
    ui.meter.innerHTML = '';
    for (let i = 0; i < QUESTIONS_PER_SESSION; i++) {
      const seg = document.createElement('span');
      if (state.results[i]) seg.className = state.results[i];
      else if (i === state.index) seg.className = 'current';
      ui.meter.appendChild(seg);
    }
    const trickyTag = state.problems[state.index]?.tricky ? ' · 💪 Tricky one!' : '';
    ui.count.textContent = `Question ${state.index + 1} of ${QUESTIONS_PER_SESSION}${trickyTag}`;
  }

  function renderAnswer(mood = '') {
    ui.answer.textContent = state.typed || ' ';
    ui.answer.className = `answer ${mood}`;
  }

  function setFeedback(text, mood = '') {
    ui.feedback.textContent = text;
    ui.feedback.className = `feedback ${mood}`;
  }

  function setLocked(locked) {
    state.locked = locked;
    ui.keypad.classList.toggle('locked', locked);
  }

  // Advances the saved cursor up front, so a round she quits still moves on to fresh stories.
  function takeStories(level, count) {
    const cursor = progress.storyCursor[level.alias] ?? 0;
    progress.storyCursor[level.alias] = cursor + count;
    saveProgress();
    return Array.from({ length: count }, (_, i) => level.stories[(cursor + i) % level.stories.length]);
  }

  function promptsFor(level, pairs) {
    if (!level.stories) return pairs.map(([a, b]) => `${a} + ${b} =`);
    const stories = takeStories(level, pairs.length);
    return pairs.map(([a, b], i) => fillStory(stories[i], { a, b }));
  }

  function startSession(level) {
    clearTimeout(state.pendingTimer);
    loadConfetti();
    state.level = level;
    const trickyKeys = trickyKeysFor(level.alias);
    const pairs = makeSession(level, trickyKeys);
    const prompts = promptsFor(level, pairs);
    state.problems = pairs.map(([a, b], i) => ({
      a,
      b,
      prompt: prompts[i],
      tricky: trickyKeys.includes(problemKey([a, b])),
    }));
    state.index = 0;
    state.results = [];
    show('quiz');
    showQuestion();
  }

  function showQuestion() {
    state.typed = '';
    state.triesLeft = TRIES_PER_QUESTION;
    ui.problem.textContent = state.problems[state.index].prompt;
    ui.problem.classList.toggle('story', Boolean(state.level.stories));
    renderAnswer();
    setFeedback('');
    renderMeter();
    setLocked(false);
  }

  function pressKey(key) {
    if (state.locked) return;
    if (key === 'back') state.typed = state.typed.slice(0, -1);
    else if (key === 'go') return checkAnswer();
    else if (state.typed.length < MAX_ANSWER_DIGITS) state.typed = (state.typed + key).replace(/^0+(?=\d)/, '');
    renderAnswer();
    setFeedback('');
  }

  function checkAnswer() {
    if (!state.typed) return;
    const { a, b } = state.problems[state.index];
    const correct = a + b;
    const isRight = Number(state.typed) === correct;
    const firstTry = state.triesLeft === TRIES_PER_QUESTION;
    state.triesLeft--;

    if (isRight) {
      renderAnswer('right');
      playSound('right');
      setFeedback(CHEERS[randInt(0, CHEERS.length - 1)], 'right');
      finishQuestion(firstTry ? 'right' : 'wrong', 900);
    } else if (state.triesLeft > 0) {
      renderAnswer('wrong');
      playSound('wrong');
      setFeedback('Try again!', 'wrong');
      setLocked(true);
      later(() => { state.typed = ''; renderAnswer(); setLocked(false); }, 700);
    } else {
      state.typed = String(correct);
      renderAnswer('right');
      playSound('wrong');
      setFeedback(`It's ${correct}`, 'wrong');
      finishQuestion('wrong', 2000);
    }
  }

  function finishQuestion(result, delayMs) {
    state.results[state.index] = result;
    setLocked(true);
    renderMeter();
    later(() => {
      state.index++;
      if (state.index < QUESTIONS_PER_SESSION) showQuestion();
      else showDone();
    }, delayMs);
  }

  function renderDone(round) {
    $('done-total').textContent = progress.totalStars - round.stars;
    $('done-total').classList.remove('bump');
    $('stars').innerHTML = '<span class="star">⭐</span>'.repeat(MAX_STARS);
    $('done-title').textContent = DONE_TITLES[round.stars];
    $('done-message').textContent = round.message;
    $('score').textContent = `${round.firstTryCorrect} of ${QUESTIONS_PER_SESSION} right on the first try`;
    $('medal-note').textContent = '';
    $('reward').classList.remove('shown');
  }

  // Stars pop in one at a time, then fanfare + confetti, then the sticker reveal.
  // Every step goes through later() so leaving the screen cancels the rest.
  function celebrate(round) {
    const starEls = $('stars').children;
    const revealStar = shown => {
      if (shown === round.stars) return later(() => finale(round), 350);
      starEls[shown].classList.add('earned');
      playSound(`star${shown + 1}`);
      later(() => revealStar(shown + 1), 550);
    };
    later(() => revealStar(0), 400);
  }

  function showMedalNote(round) {
    const lines = [round.medalGoal];
    if (round.trickyBeaten) lines.push(`💪 You beat ${plural(round.trickyBeaten, 'tricky fact')}!`);
    $('medal-note').innerHTML = lines.join('<br>');
  }

  function bookNoteFor(round) {
    if (!round.filledBook) return '';
    const filled = `📒 You filled the ${round.filledBook.name} book!`;
    if (!round.openedBook) return `${filled} You collected every sticker!`;
    return `${filled} New book: ${round.openedBook.icon} ${round.openedBook.name}`;
  }

  function finale(round) {
    playSound('fanfare');
    fireConfetti(round.stars);
    $('done-total').textContent = progress.totalStars;
    $('done-total').classList.add('bump');
    later(() => revealReward(round), 900);
  }

  // Medals wait until here, so the next-medal line can't give one away before it is revealed.
  function revealReward(round) {
    showMedalNote(round);
    $('reward-prize').textContent = round.newMedal?.icon ?? round.sticker ?? '';
    $('reward-note').textContent = round.newMedal
      ? `You earned a ${round.newMedal.name} medal on ${state.level.name}!`
      : bookNoteFor(round);
    if (round.newMedal || round.filledBook) {
      $('reward-label').textContent = round.newMedal ? 'New medal!' : 'New sticker!';
      playSound('medal');
      fireConfetti(MAX_STARS);
    } else if (round.sticker) {
      $('reward-label').textContent = round.isNewSticker ? 'New sticker!' : 'Bonus sticker!';
      playSound('sticker');
    } else {
      $('reward-label').textContent =
        round.stars === MAX_STARS ? 'No sticker this time. Keep trying!' : 'Try again to win a sticker!';
    }
    $('reward').classList.add('shown');
  }

  function showDone() {
    const round = recordRound(state.level, state.problems, state.results);
    renderDone(round);
    show('done');
    celebrate(round);
  }

  // Console-only testing shortcut. It records a real round, so it changes saved stars and stickers.
  window.cheat = rightCount => {
    if (!ui.screens.quiz.classList.contains('active')) return 'Start a round first.';
    if (!Number.isInteger(rightCount) || rightCount < 0 || rightCount > QUESTIONS_PER_SESSION) {
      return `Pass a whole number from 0 to ${QUESTIONS_PER_SESSION}.`;
    }
    clearTimeout(state.pendingTimer);
    setLocked(true);
    state.results = Array.from({ length: QUESTIONS_PER_SESSION }, (_, i) => (i < rightCount ? 'right' : 'wrong'));
    showDone();
    return `Finished with ${rightCount} of ${QUESTIONS_PER_SESSION} right.`;
  };

  document.addEventListener('keydown', e => {
    if (!ui.screens.quiz.classList.contains('active')) return;
    if (/^\d$/.test(e.key)) pressKey(e.key);
    else if (e.key === 'Backspace') pressKey('back');
    else if (e.key === 'Enter') pressKey('go');
  });

  document.addEventListener('click', unlockAudio, true);
  document.addEventListener('keydown', unlockAudio, true);

  $('quit').addEventListener('click', goHome);
  $('again').addEventListener('click', () => startSession(state.level));
  $('home-btn').addEventListener('click', goHome);
  $('sound-toggle').addEventListener('click', toggleSound);
  $('sticker-book-btn').addEventListener('click', () => showStickerBook());
  $('sticker-total-btn').addEventListener('click', () => showStickerBook());
  $('book-back').addEventListener('click', goHome);
  $('activity-btn').addEventListener('click', showActivity);
  $('star-total-btn').addEventListener('click', showActivity);
  $('activity-back').addEventListener('click', goHome);
  $('info-btn').addEventListener('click', showInfo);
  $('info-back').addEventListener('click', goHome);

  renderHome();
  renderKeypad();
</script>
</body>
</html>
