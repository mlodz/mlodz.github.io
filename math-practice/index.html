<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Math Practice</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-title" content="Math">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6c4ee0">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple: #6c4ee0;
    --purple-dk: #5236c4;
    --bg: #f5f2ff;
    --card: #ffffff;
    --ink: #2a2350;
    --muted: #7a7299;
    --line: #e4defa;
    --green: #22b573;
    --red: #ef5a5a;
    --gold: #ffb627;
  }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100%;
  }

  body {
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  button {
    font-family: inherit;
    color: inherit;
    border: 0;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .screen { display: none; flex: 1; flex-direction: column; width: 100%; max-width: 480px; margin: 0 auto; padding: 20px 16px 24px; }
  .screen.active { display: flex; }

  /* ---------- Home ---------- */
  .hero {
    background: var(--purple);
    color: #fff;
    border-radius: 24px;
    padding: 28px 22px;
    text-align: center;
    margin-bottom: 20px;
    position: relative;
  }
  .hero h1 { font-size: 36px; font-weight: 700; line-height: 1.1; }
  .hero p { font-size: 18px; opacity: 0.85; margin-top: 6px; }
  .hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .stat {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 96px; padding: 12px 8px;
    background: rgba(255, 255, 255, 0.16); border-radius: 22px;
    color: #fff;
  }
  .stat:active { transform: scale(0.96); }
  .stat-row { display: flex; align-items: center; gap: 8px; }
  .stat-num { font-size: 44px; font-weight: 700; line-height: 1; }
  .stat-icon { font-size: 34px; line-height: 1; }
  .stat-label { font-size: 17px; opacity: 0.85; margin-top: 6px; }
  .section-label { font-size: 20px; font-weight: 600; color: var(--muted); margin: 0 4px 10px; }
  .sound-toggle {
    position: absolute; top: 10px; right: 10px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    font-size: 22px;
  }

  .levels { display: grid; gap: 12px; }

  .level {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    min-height: 64px;
    padding: 14px 18px;
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 18px;
    text-align: left;
    transition: transform 0.1s ease;
  }
  .level:active { transform: scale(0.97); }
  .level-name { font-size: 22px; font-weight: 600; }
  .level-example { font-size: 18px; color: var(--muted); white-space: nowrap; }
  .level .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .level-left { display: flex; align-items: center; gap: 12px; }
  .level-best { display: block; font-size: 18px; letter-spacing: 2px; line-height: 1; margin-top: 2px; color: var(--line); }
  .level-best .earned { color: var(--gold); }

  .home-links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .home-link {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    min-height: 88px; padding: 12px 8px;
    background: #fff6dd; border: 3px solid #ffe4a1; border-radius: 18px;
    font-size: 20px; font-weight: 600;
  }
  .home-link:active { transform: scale(0.97); }
  .home-link .icon { font-size: 30px; line-height: 1; }
  .home-link .count-pill { font-size: 16px; color: #b07a00; }

  /* ---------- Sticker book + Activity ---------- */
  .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .page-head h2 { font-size: 30px; font-weight: 700; }
  .page-sub { color: var(--muted); font-size: 18px; margin-bottom: 16px; }

  .day-list { display: grid; gap: 10px; }
  .day-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px;
    background: var(--card); border: 3px solid var(--line); border-radius: 18px;
  }
  .day-name { font-size: 22px; font-weight: 600; }
  .day-rounds { font-size: 16px; color: var(--muted); }
  .day-stars { font-size: 26px; font-weight: 700; white-space: nowrap; }
  .empty-note { text-align: center; color: var(--muted); font-size: 20px; padding: 40px 12px; }
  .sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sticker-tile {
    aspect-ratio: 1; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 3px solid var(--line);
    font-size: 40px;
  }
  .sticker-tile.missing { color: var(--line); font-size: 30px; font-weight: 700; background: transparent; border-style: dashed; }

  /* ---------- Quiz ---------- */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .quit {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--card); border: 3px solid var(--line);
    font-size: 20px; font-weight: 700; color: var(--muted);
    flex-shrink: 0;
  }
  .meter { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
  .meter span { height: 14px; border-radius: 7px; background: var(--line); transition: background 0.2s ease; }
  .meter span.right { background: var(--green); }
  .meter span.wrong { background: var(--gold); }
  .meter span.current { background: var(--purple); opacity: 0.45; }
  .count { text-align: center; color: var(--muted); font-size: 17px; margin-bottom: 8px; }

  .problem-card {
    background: var(--card);
    border-radius: 24px;
    border: 3px solid var(--line);
    padding: 24px 12px;
    text-align: center;
    margin-bottom: 14px;
  }
  .problem { font-size: clamp(48px, 15vw, 64px); font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .problem.story { font-size: 22px; font-weight: 600; line-height: 1.4; white-space: normal; text-align: left; padding: 0 8px; }
  .answer {
    display: inline-block;
    min-width: 2.2em;
    margin-top: 10px;
    padding: 2px 16px;
    font-size: clamp(48px, 15vw, 64px);
    font-weight: 700;
    line-height: 1.2;
    border-bottom: 5px solid var(--purple);
    color: var(--purple);
    min-height: 1.3em;
  }
  .answer.right { color: var(--green); border-color: var(--green); }
  .answer.wrong { color: var(--red); border-color: var(--red); animation: shake 0.35s; }
  .feedback { min-height: 30px; margin-top: 10px; font-size: 22px; font-weight: 600; }
  .feedback.right { color: var(--green); }
  .feedback.wrong { color: var(--red); }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: auto; }
  .key {
    height: 64px;
    border-radius: 16px;
    background: var(--card);
    border: 3px solid var(--line);
    font-size: 30px;
    font-weight: 600;
    transition: transform 0.08s ease;
  }
  .key:active { transform: scale(0.94); background: var(--line); }
  .key.back { color: var(--muted); font-size: 26px; }
  .key.go { background: var(--purple); border-color: var(--purple); color: #fff; font-size: 24px; }
  .key.go:active { background: var(--purple-dk); }
  .keypad.locked .key { pointer-events: none; opacity: 0.6; }

  /* ---------- Done ---------- */
  .done { justify-content: center; text-align: center; }
  .stars { font-size: 56px; letter-spacing: 4px; margin-bottom: 8px; }
  .star { display: inline-block; opacity: 0.18; filter: grayscale(1); }
  .star.earned { opacity: 1; filter: none; animation: pop 0.45s ease-out; }
  .new-best { display: inline-block; min-height: 30px; margin-bottom: 6px; font-size: 20px; font-weight: 600; color: #b07a00; }
  .reward {
    visibility: hidden;
    background: #fff6dd; border: 3px solid #ffe4a1; border-radius: 20px;
    padding: 12px; margin-bottom: 16px;
  }
  .reward.shown { visibility: visible; animation: pop 0.5s ease-out; }
  .reward-label { font-size: 20px; font-weight: 600; color: #b07a00; }
  .reward-sticker { font-size: 72px; line-height: 1.2; }

  @keyframes pop {
    0% { transform: scale(0); }
    60% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .done h2 { font-size: 40px; font-weight: 700; }
  .done-message { font-size: 24px; font-weight: 600; color: var(--purple); margin-bottom: 20px; line-height: 1.25; }
  .score { font-size: 24px; color: var(--muted); margin: 8px 0 4px; }
  .done-total { font-size: 22px; font-weight: 600; margin-bottom: 10px; }
  .done-total .num { display: inline-block; }
  .done-total .num.bump { animation: pop 0.45s ease-out; }
  .big-btn {
    display: block; width: 100%;
    min-height: 60px; border-radius: 18px;
    font-size: 24px; font-weight: 600;
    margin-bottom: 12px;
  }
  .big-btn.primary { background: var(--purple); color: #fff; }
  .big-btn.secondary { background: var(--card); border: 3px solid var(--line); }
</style>
</head>
<body>

<section class="screen active" id="home">
  <div class="hero">
    <button class="sound-toggle" id="sound-toggle"></button>
    <h1>Math Practice</h1>
    <div class="hero-stats">
      <button class="stat" id="star-total-btn" aria-label="See my activity">
        <span class="stat-row">
          <span class="stat-num" id="star-total"></span>
          <span class="stat-icon" aria-hidden="true">⭐</span>
        </span>
        <span class="stat-label">stars earned ›</span>
      </button>
      <button class="stat" id="sticker-total-btn" aria-label="See my stickers">
        <span class="stat-row">
          <span class="stat-num" id="sticker-total"></span>
          <span class="stat-icon" id="sticker-total-icon" aria-hidden="true"></span>
        </span>
        <span class="stat-label">stickers earned ›</span>
      </button>
    </div>
  </div>
  <div class="section-label">Pick a level!</div>
  <div class="levels" id="levels"></div>
  <div class="home-links">
    <button class="home-link" id="sticker-book-btn"></button>
    <button class="home-link" id="activity-btn"></button>
  </div>
</section>

<section class="screen" id="stickers">
  <div class="page-head">
    <button class="quit" id="book-back" aria-label="Back to levels">&times;</button>
    <h2>My Stickers</h2>
  </div>
  <div class="page-sub" id="book-count"></div>
  <div class="sticker-grid" id="sticker-grid"></div>
</section>

<section class="screen" id="activity">
  <div class="page-head">
    <button class="quit" id="activity-back" aria-label="Back to levels">&times;</button>
    <h2>Activity</h2>
  </div>
  <div class="page-sub" id="activity-sub"></div>
  <div class="day-list" id="day-list"></div>
</section>

<section class="screen" id="quiz">
  <div class="topbar">
    <button class="quit" id="quit" aria-label="Back to levels">&times;</button>
    <div class="meter" id="meter"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="problem-card">
    <div class="problem" id="problem"></div>
    <div class="answer" id="answer"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="keypad" id="keypad"></div>
</section>

<section class="screen done" id="done">
  <div class="stars" id="stars"></div>
  <h2 id="done-title"></h2>
  <div class="score" id="score"></div>
  <div class="done-total">Total: <span class="num" id="done-total"></span> ⭐</div>
  <div><span class="new-best" id="new-best"></span></div>
  <div class="reward" id="reward">
    <div class="reward-label" id="reward-label"></div>
    <div class="reward-sticker" id="reward-sticker"></div>
  </div>
  <div class="done-message" id="done-message"></div>
  <button class="big-btn primary" id="again">Play again</button>
  <button class="big-btn secondary" id="home-btn">Pick a level</button>
</section>

<script>
  const QUESTIONS_PER_SESSION = 10;
  const TRIES_PER_QUESTION = 2;
  const MAX_ANSWER_DIGITS = 3;
  const MAX_STARS = 3;
  const STARS_FOR_STICKER = 2;
  const STORAGE_KEY = 'math-practice:v1';
  const MAX_SAVED_ROUNDS = 2000;

  const STICKERS = Object.freeze([
    '🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯',
    '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦', '🦄', '🐝',
    '🦋', '🐞', '🐢', '🐙', '🦑', '🦀', '🐠', '🐬', '🐳', '🦈',
    '🦒', '🐘', '🦔', '🦥', '🦦', '🦩', '🦚', '🦜', '🐉', '🦖',
  ]);

  function randInt(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }

  function nextTen(n) {
    return Math.ceil(n / 10) * 10;
  }

  // Each generator returns [a, b]; it retries until the pair fits the level's rule.
  function pairWhere(pick, fits) {
    for (;;) {
      const [a, b] = pick();
      if (fits(a, b)) return [a, b];
    }
  }

  function twoDigitNotEndingInZero(min, max) {
    return pairWhere(() => [randInt(min, max), 0], a => a % 10 !== 0)[0];
  }

  // `alias` is the level's permanent saved-data key and is never shown. Changing one orphans
  // that level's saved stars and round history, so rename `name` freely but leave `alias` alone.
  // Story templates, used in order. `{a}` / `{b}` insert a number. `{a:one|many}` inserts the number
  // followed by `one` when it is 1 and `many` otherwise, so verbs that agree go inside it too
  // ("{a:dragon is|dragons are}"). Only the two numbers can be 1; the question is always plural.
  const WINGS_OF_FIRE_STORIES = Object.freeze([
    "Clay ate {a:cow|cows} for breakfast. Then he ate {b:cow|cows} for lunch. How many cows did Clay eat?",
    "Starflight read {a:scroll|scrolls} on Monday. He read {b:more scroll|more scrolls} on Tuesday. How many scrolls did he read?",
    "{a:SkyWing flies|SkyWings fly} over the mountains. {b:SeaWing swims|SeaWings swim} below. How many dragons is that in all?",
    "Glory turned {a:scale|scales} purple. Then she turned {b:more scale|more scales} gold. How many scales changed color?",
    "{a:dragonet is|dragonets are} in the Jade Mountain library. {b:dragonet comes|dragonets come} in. How many dragonets are in the library now?",
    "Tsunami found {a:shell|shells} on the beach. Sunny found {b:shell|shells}. How many shells did they find together?",
    "Peril accidentally burned {a:scroll|scrolls} on Monday and {b:scroll|scrolls} on Tuesday. How many scrolls did Peril burn?",
    "Kinkajou ate {a:mango|mangoes} and {b:banana|bananas}. How many pieces of fruit did she eat?",
    "Qibli has {a:gold coin|gold coins} in his pouch. He finds {b:more coin|more coins}. How many coins does Qibli have now?",
    "Sunny saw {a:shooting star|shooting stars} last night and {b:shooting star|shooting stars} tonight. How many shooting stars did she see?",
    "{a:RainWing is|RainWings are} napping in the sun. {b:more RainWing joins|more RainWings join} the nap. How many RainWings are napping now?",
    "Moon picked {a:flower|flowers} in the rainforest. Then she picked {b:more flower|more flowers}. How many flowers did Moon pick?",
    "Winter caught {a:fish|fish} in the icy sea. Then he caught {b:more fish|more fish}. How many fish did Winter catch?",
    "Turtle swam {a:lap|laps} around the lake in the morning and {b:lap|laps} in the afternoon. How many laps did Turtle swim?",
    "Clay rolled in the mud {a:time|times} before lunch and {b:time|times} after lunch. How many times did Clay roll in the mud?",
    "A MudWing has {a:ruby|rubies} and {b:emerald|emeralds} in a treasure pile. How many gems are in the pile?",
    "{a:IceWing is|IceWings are} sliding on the ice. {b:more IceWing starts|more IceWings start} sliding too. How many IceWings are sliding?",
    "Blue spun {a:silk thread|silk threads} in the morning. He spun {b:more thread|more threads} at night. How many threads did Blue spin?",
    "Cricket read {a:book|books} last week and {b:book|books} this week. How many books did Cricket read?",
    "Sundew planted {a:seed|seeds} in the morning and {b:seed|seeds} in the afternoon. How many seeds did Sundew plant?",
    "{a:SilkWing flutters|SilkWings flutter} above the treetops. {b:more SilkWing flies|more SilkWings fly} up. How many SilkWings are flying now?",
    "Swordtail did {a:flip|flips} in the air. Then he did {b:more flip|more flips}. How many flips did Swordtail do?",
    "Glory changed colors {a:time|times} before breakfast and {b:time|times} after breakfast. How many times did Glory change colors?",
    "Tsunami won {a:race|races} in the lagoon. Then she won {b:more race|more races}. How many races did Tsunami win?",
    "Starflight has {a:scroll|scrolls} on one shelf and {b:scroll|scrolls} on another shelf. How many scrolls does he have?",
    "Clay carried {a:rock|rocks} out of the cave. Then he carried {b:more rock|more rocks}. How many rocks did Clay carry?",
    "Sunny counted {a:cactus|cacti} in the desert. Then she counted {b:more cactus|more cacti}. How many cacti did she count?",
    "{a:SandWing is|SandWings are} at the oasis. {b:more SandWing lands|more SandWings land} there. How many SandWings are at the oasis now?",
    "Kinkajou turned {a:scale|scales} pink and {b:scale|scales} yellow. How many scales did she change?",
    "Qibli solved {a:puzzle|puzzles} before lunch and {b:puzzle|puzzles} after lunch. How many puzzles did Qibli solve?",
    "Peril melted {a:icicle|icicles} by accident. Then she melted {b:more icicle|more icicles}. How many icicles did Peril melt?",
    "Winter counted {a:snowflake|snowflakes} on his wing. Then {b:more snowflake|more snowflakes} landed. How many snowflakes are on his wing now?",
    "Moon visited {a:classroom|classrooms} on Monday and {b:classroom|classrooms} on Tuesday. How many classrooms did Moon visit?",
    "Turtle found {a:pearl|pearls} in the river and {b:pearl|pearls} in the lake. How many pearls did Turtle find?",
    "Tsunami taught {a:class|classes} on Monday and {b:class|classes} on Tuesday. How many classes did Tsunami teach?",
    "{a:HiveWing marches|HiveWings march} through the Hive. {b:more HiveWing marches|more HiveWings march} behind. How many HiveWings are marching?",
    "{a:LeafWing hides|LeafWings hide} in the trees. {b:more LeafWing hides|more LeafWings hide} in the bushes. How many LeafWings are hiding?",
    "Sundew grew {a:vine|vines} on Monday. She grew {b:more vine|more vines} on Tuesday. How many vines did Sundew grow?",
    "Blue counted {a:butterfly|butterflies} in the garden. Then {b:more butterfly|more butterflies} flew in. How many butterflies are in the garden now?",
    "Cricket asked {a:question|questions} in class. Then she asked {b:more question|more questions}. How many questions did Cricket ask?",
    "Clay ate {a:sheep|sheep} and {b:goat|goats}. How many animals did Clay eat?",
    "Glory's sloth ate {a:leaf|leaves}. Then it ate {b:more leaf|more leaves}. How many leaves did the sloth eat?",
    "Starflight wrote {a:page|pages} of notes in the morning and {b:page|pages} in the evening. How many pages did he write?",
    "Sunny made {a:sandcastle|sandcastles} in the desert. Tsunami made {b:sandcastle|sandcastles} on the beach. How many sandcastles did they make?",
    "{a:SeaWing glows|SeaWings glow} in the dark water. {b:more SeaWing glows|more SeaWings glow} nearby. How many SeaWings are glowing?",
    "{a:NightWing is|NightWings are} watching the moons. {b:more NightWing comes|more NightWings come} to watch. How many NightWings are watching now?",
    "Kinkajou told {a:joke|jokes} at breakfast and {b:joke|jokes} at dinner. How many jokes did Kinkajou tell?",
    "Qibli found {a:scorpion|scorpions} under a rock. Then he found {b:more scorpion|more scorpions}. How many scorpions did Qibli find?",
    "Winter flew {a:mile|miles} north. Then he flew {b:more mile|more miles}. How many miles did Winter fly?",
    "Moon read {a:scroll|scrolls} in the library and {b:scroll|scrolls} in her cave. How many scrolls did Moon read?",
    "Turtle drew {a:picture|pictures} of the ocean. Then he drew {b:more picture|more pictures}. How many pictures did Turtle draw?",
    "Peril roasted {a:fish|fish} for breakfast and {b:fish|fish} for lunch. How many fish did Peril roast?",
    "The Jade Winglet has {a:dragonet|dragonets} in class. The Gold Winglet has {b:dragonet|dragonets}. How many dragonets is that in all?",
    "Clay hugged {a:friend|friends} at breakfast. Then he hugged {b:more friend|more friends}. How many friends did Clay hug?",
    "Tsunami splashed {a:dragon|dragons} in the lake. Then she splashed {b:more dragon|more dragons}. How many dragons did Tsunami splash?",
    "Glory picked {a:mango|mangoes} from one tree and {b:mango|mangoes} from another tree. How many mangoes did Glory pick?",
    "Starflight learned {a:new word|new words} on Monday and {b:new word|new words} on Tuesday. How many new words did he learn?",
    "Sunny found {a:smooth stone|smooth stones} in the sand. Then she found {b:more stone|more stones}. How many stones did Sunny find?",
    "{a:MudWing is|MudWings are} sleeping in the swamp. {b:more MudWing lies|more MudWings lie} down too. How many MudWings are sleeping now?",

  const STORY_SLOT = /\{([ab])(?::([^|}]*)\|([^}]*))?\}/g;

  function fillStory(template, numbers) {
    return template.replace(STORY_SLOT, (_, slot, one, many) => {
      const n = numbers[slot];
      if (one === undefined) return String(n);
      return `${n} ${n === 1 ? one : many}`;
    });
  }

  const LEVELS = [
    {
      alias: 'add-1digit-1digit-sum-to-10',
      name: 'Easy', example: '7 + 2', color: '#22b573',
      make: () => pairWhere(() => [randInt(1, 9), randInt(1, 9)], (a, b) => a + b <= 10),
    },
    {
      alias: 'add-1digit-1digit-sum-over-10',
      name: 'Medium', example: '8 + 5', color: '#3fa7f5',
      make: () => pairWhere(() => [randInt(2, 9), randInt(2, 9)], (a, b) => a + b > 10),
    },
    {
      alias: 'story-wings-of-fire-1digit-1digit',
      name: 'Wings of Fire', example: '🐉 stories', color: '#e8590c',
      stories: WINGS_OF_FIRE_STORIES,
      make: () => [randInt(2, 9), randInt(2, 9)],
    },
    {
      alias: 'add-teen-1digit-sum-to-20',
      name: 'Hard', example: '12 + 7', color: '#ffb627',
      make: () => pairWhere(() => [randInt(10, 19), randInt(1, 9)], (a, b) => a + b <= 20),
    },
    {
      alias: 'add-teen-1digit-sum-over-20',
      name: 'Extra Hard', example: '15 + 8', color: '#ff8a3d',
      make: () => pairWhere(() => [randInt(12, 19), randInt(2, 9)], (a, b) => a + b > 20),
    },
    {
      alias: 'add-teen-teen',
      name: 'Super Hard', example: '12 + 17', color: '#ef5a5a',
      make: () => [randInt(10, 19), randInt(10, 19)],
    },
    {
      alias: 'add-2digit-1digit-make-next-ten',
      name: 'Tens Easy', example: '23 + 7', color: '#a25ce8',
      make: () => {
        const a = twoDigitNotEndingInZero(11, 99);
        return [a, nextTen(a) - a];
      },
    },
    {
      alias: 'add-2digit-2digit-make-ten',
      name: 'Tens Medium', example: '61 + 29', color: '#6c4ee0',
      make: () => {
        // b's ones digit completes a's to 10, and the total stays at or under 100.
        const a = twoDigitNotEndingInZero(11, 89);
        const extraTens = randInt(1, (100 - nextTen(a)) / 10);
        return [a, nextTen(a) - a + extraTens * 10];
      },
    },
  ];

  function problemKey([a, b]) {
    return `${a}+${b}`;
  }

  function makeSession(level) {
    const problems = [];
    const seen = new Set();
    for (let attempts = 0; problems.length < QUESTIONS_PER_SESSION; attempts++) {
      const pair = level.make();
      const allowRepeat = attempts > 500; // tiny levels may not have 10 distinct problems
      if (seen.has(problemKey(pair)) && !allowRepeat) continue;
      seen.add(problemKey(pair));
      problems.push(pair);
    }
    return problems;
  }

  function longestRightRun(results) {
    let longest = 0;
    let current = 0;
    for (const result of results) {
      current = result === 'right' ? current + 1 : 0;
      longest = Math.max(longest, current);
    }
    return longest;
  }

  // The device's local calendar date, so a day streak follows her bedtime, not UTC.
  function localDay(date) {
    const pad = n => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  }

  function starsFor(firstTryCorrect) {
    if (firstTryCorrect === QUESTIONS_PER_SESSION) return 3;
    if (firstTryCorrect >= 7) return 2;
    return 1;
  }

  // Shown in order, one per round, looping back to the start; see `messageCursor` in saved data.

  function messageSetFor(stars) {
    return stars === MAX_STARS ? 'silly' : 'growth';

  function pickSticker(owned) {
    const unowned = STICKERS.filter(sticker => !owned.includes(sticker));
    const pool = unowned.length ? unowned : STICKERS;
    return pool[randInt(0, pool.length - 1)];
  }

  // ---------- Saved progress (per device; the page still works if storage is blocked) ----------

  // Saved shape (bump `schemaVersion` and migrate in loadProgress if this changes incompatibly):
  //   totalStars: all-time stars; kept as a counter because `rounds` gets trimmed
  //   days:      { 'YYYY-MM-DD' local: { stars, rounds } }; never trimmed, ~40 bytes a day
  //   bestStars: { [level alias]: 1–3 }
  //   stickers:  emoji in the order earned
  //   rounds:    oldest first, capped at MAX_SAVED_ROUNDS —
  //              { day: 'YYYY-MM-DD' local, finishedAt: epoch ms, level: alias,
  //                stars, firstTryCorrect, longestRun, sticker (null below STARS_FOR_STICKER), isNewSticker }
  //   storyCursor: { [level alias]: stories used so far }; next story is cursor % length
  //   messageCursor: { silly, growth }: rounds that have used each set; next line is cursor % length
  //   soundOn:   boolean
  function loadProgress() {
    const fresh = { schemaVersion: 1, totalStars: 0, days: {}, bestStars: {}, stickers: [], rounds: [], storyCursor: {}, messageCursor: { silly: 0, growth: 0 }, soundOn: true };
    try {
      return { ...fresh, ...JSON.parse(localStorage.getItem(STORAGE_KEY)) };
    } catch {
      return fresh;
    }
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    } catch {}
  }

  const progress = loadProgress();

  function recordRound(levelAlias, results) {
    const firstTryCorrect = results.filter(r => r === 'right').length;
    const stars = starsFor(firstTryCorrect);
    const previousBest = progress.bestStars[levelAlias] ?? 0;
    const earnedSticker = stars >= STARS_FOR_STICKER;
    const sticker = earnedSticker ? pickSticker(progress.stickers) : null;
    const isNewSticker = earnedSticker && !progress.stickers.includes(sticker);
    const messageSet = messageSetFor(stars);
    const messages = MESSAGE_SETS[messageSet];
    const cursor = progress.messageCursor[messageSet] ?? 0;
    const message = messages[cursor % messages.length];
    const now = new Date();
    const day = localDay(now);
    const dayTotals = progress.days[day] ?? { stars: 0, rounds: 0 };

    progress.totalStars += stars;
    progress.days[day] = { stars: dayTotals.stars + stars, rounds: dayTotals.rounds + 1 };
    if (stars > previousBest) progress.bestStars[levelAlias] = stars;
    if (isNewSticker) progress.stickers.push(sticker);
    progress.messageCursor[messageSet] = cursor + 1;
    progress.rounds.push({
      day,
      finishedAt: now.getTime(),
      level: levelAlias,
      stars,
      firstTryCorrect,
      longestRun: longestRightRun(results),
      sticker,
      isNewSticker,
    });
    progress.rounds = progress.rounds.slice(-MAX_SAVED_ROUNDS);
    saveProgress();
    return { firstTryCorrect, stars, beatOldBest: previousBest > 0 && stars > previousBest, sticker, isNewSticker, message };
  }

  // ---------- Sound (synthesized, so there are no audio files to load) ----------

  // Each note is [frequencyHz, startSec, durationSec].
  const SOUNDS = Object.freeze({
    right: [[880, 0, 0.15], [1318.5, 0.08, 0.3]],
    wrong: [[220, 0, 0.18], [185, 0.12, 0.25]],
    star1: [[659.25, 0, 0.35]],
    star2: [[783.99, 0, 0.35]],
    star3: [[1046.5, 0, 0.45]],
    fanfare: [[523.25, 0, 0.15], [659.25, 0.12, 0.15], [783.99, 0.24, 0.15], [1046.5, 0.36, 0.7]],
    sticker: [[1046.5, 0, 0.12], [1318.5, 0.1, 0.12], [1568, 0.2, 0.4]],
  });

  let audioCtx = null;

  // iOS only lets audio start from inside a user gesture, so this runs on every tap.
  function unlockAudio() {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    audioCtx ??= new AudioContextClass();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(name) {
    if (!progress.soundOn || !audioCtx) return;
    const now = audioCtx.currentTime;
    for (const [freq, start, duration] of SOUNDS[name]) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + start);
      gain.gain.exponentialRampToValueAtTime(0.3, now + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + start + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + start);
      osc.stop(now + start + duration + 0.05);
    }
  }

  const CONFETTI_SRC = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js';

  // Fetched when the first round starts, not at page load, so it never delays the first paint.
  function loadConfetti() {
    if (document.querySelector(`script[src="${CONFETTI_SRC}"]`)) return;
    const script = document.createElement('script');
    script.src = CONFETTI_SRC;
    script.defer = true;
    document.head.appendChild(script);
  }

  function fireConfetti(stars) {
    if (!window.confetti) return; // still loading, or CDN unavailable offline
    const burst = { particleCount: 50 * stars, spread: 60 + 25 * stars, origin: { y: 0.55 }, disableForReducedMotion: true };
    confetti(burst);
    if (stars === MAX_STARS) {
      confetti({ ...burst, angle: 60, origin: { x: 0, y: 0.7 } });
      confetti({ ...burst, angle: 120, origin: { x: 1, y: 0.7 } });
    }
  }

  const CHEERS = ['Great job!', 'You got it!', 'Awesome!', 'Nice!', 'Super!', 'Yes!'];
  const DONE_TITLES = { 3: 'Perfect!', 2: 'Great work!', 1: 'Good practice!' };

    index: 0,

  function bestStarsHtml(best) {

  function renderLevels() {

  // Parsed as local midnight; `new Date('YYYY-MM-DD')` would be UTC and can land on the wrong day.
  function dateFromDay(day) {
    const [y, m, d] = day.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function dayLabel(day, today) {
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    if (day === localDay(today)) return 'Today';
    if (day === localDay(yesterday)) return 'Yesterday';
    return dateFromDay(day).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function showActivity() {
    const list = $('day-list');
    list.innerHTML = '';
    // 'YYYY-MM-DD' sorts chronologically as plain text.
    const days = Object.keys(progress.days).sort().reverse();
    const today = new Date();
    for (const day of days) {
      const { stars, rounds } = progress.days[day];
      const row = document.createElement('div');
      row.className = 'day-row';
      row.innerHTML = `
        <div>
          <div class="day-name">${dayLabel(day, today)}</div>
          <div class="day-rounds">${plural(rounds, 'round')}</div>
        </div>
        <div class="day-stars">${stars} ⭐</div>`;
      list.appendChild(row);
    }
    if (!days.length) list.innerHTML = '<div class="empty-note">No rounds yet. Pick a level to start!</div>';
    $('activity-sub').textContent = `${plural(progress.totalStars, 'star')} on ${plural(days.length, 'day')}`;
    show('activity');
  }

  function renderMeter() {
    ui.meter.innerHTML = '';
    for (let i = 0; i < QUESTIONS_PER_SESSION; i++) {

  // Advances the saved cursor up front, so a round she quits still moves on to fresh stories.
  function takeStories(level, count) {
    const cursor = progress.storyCursor[level.alias] ?? 0;
    progress.storyCursor[level.alias] = cursor + count;
    saveProgress();
    return Array.from({ length: count }, (_, i) => level.stories[(cursor + i) % level.stories.length]);
  }

  function promptsFor(level, pairs) {
    if (!level.stories) return pairs.map(([a, b]) => `${a} + ${b} =`);
    const stories = takeStories(level, pairs.length);
    return pairs.map(([a, b], i) => fillStory(stories[i], { a, b }));
  }

  function startSession(level) {
    clearTimeout(state.pendingTimer);
    loadConfetti();
    state.level = level;
    const pairs = makeSession(level);
    const prompts = promptsFor(level, pairs);
    state.problems = pairs.map(([a, b], i) => ({ a, b, prompt: prompts[i] }));
    state.index = 0;
    state.results = [];
    show('quiz');
    showQuestion();
  }

  function showQuestion() {
    state.typed = '';
    state.triesLeft = TRIES_PER_QUESTION;
    ui.problem.textContent = state.problems[state.index].prompt;
    ui.problem.classList.toggle('story', Boolean(state.level.stories));
    renderAnswer();
    setFeedback('');
    renderMeter();
    setLocked(false);
  }

  function pressKey(key) {
    if (state.locked) return;
    if (key === 'back') state.typed = state.typed.slice(0, -1);
    else if (key === 'go') return checkAnswer();
    else if (state.typed.length < MAX_ANSWER_DIGITS) state.typed = (state.typed + key).replace(/^0+(?=\d)/, '');
    renderAnswer();
    setFeedback('');
  }

  function checkAnswer() {
    if (!state.typed) return;
    const { a, b } = state.problems[state.index];
    const correct = a + b;
    const isRight = Number(state.typed) === correct;
    const firstTry = state.triesLeft === TRIES_PER_QUESTION;
    state.triesLeft--;

    if (isRight) {
      renderAnswer('right');
      playSound('right');
      setFeedback(CHEERS[randInt(0, CHEERS.length - 1)], 'right');
      finishQuestion(firstTry ? 'right' : 'wrong', 900);
    } else if (state.triesLeft > 0) {
      renderAnswer('wrong');
      playSound('wrong');
      setFeedback('Try again!', 'wrong');
      setLocked(true);
      later(() => { state.typed = ''; renderAnswer(); setLocked(false); }, 700);
    } else {
      state.typed = String(correct);
      renderAnswer('right');
      playSound('wrong');
      setFeedback(`It's ${correct}`, 'wrong');
      finishQuestion('wrong', 2000);
    }
  }

  function finishQuestion(result, delayMs) {
    state.results[state.index] = result;
    setLocked(true);
    renderMeter();
    later(() => {
      state.index++;
      if (state.index < QUESTIONS_PER_SESSION) showQuestion();
      else showDone();
    }, delayMs);
  }

  function renderDone(round) {
    $('done-total').textContent = progress.totalStars - round.stars;
    $('done-total').classList.remove('bump');
    $('stars').innerHTML = '<span class="star">⭐</span>'.repeat(MAX_STARS);
    $('done-title').textContent = DONE_TITLES[round.stars];
    $('done-message').textContent = round.message;
    $('score').textContent = `${round.firstTryCorrect} of ${QUESTIONS_PER_SESSION} right on the first try`;
    $('new-best').textContent = '';
    $('reward').classList.remove('shown');
  }

  // Stars pop in one at a time, then fanfare + confetti, then the sticker reveal.
  // Every step goes through later() so leaving the screen cancels the rest.
  function celebrate(round) {
    const starEls = $('stars').children;
    const revealStar = shown => {
      if (shown === round.stars) return later(() => finale(round), 350);
      starEls[shown].classList.add('earned');
      playSound(`star${shown + 1}`);
      later(() => revealStar(shown + 1), 550);
    };
    later(() => revealStar(0), 400);
  }

  function finale(round) {
    playSound('fanfare');
    fireConfetti(round.stars);
    $('done-total').textContent = progress.totalStars;
    $('done-total').classList.add('bump');
    if (round.beatOldBest) $('new-best').textContent = `🏆 New best on ${state.level.name}!`;
    later(() => {
      $('reward-sticker').textContent = round.sticker ?? '';
      if (round.sticker) {
        $('reward-label').textContent = round.isNewSticker ? 'New sticker!' : 'Bonus sticker!';
        playSound('sticker');
      } else {
        $('reward-label').textContent = 'Try again to win a sticker!';
      }
      $('reward').classList.add('shown');
    }, 900);
  }

  function showDone() {
    const round = recordRound(state.level.alias, state.results);
    renderDone(round);
    show('done');
    celebrate(round);
  }

  // Console-only testing shortcut. It records a real round, so it changes saved stars and stickers.
  window.cheat = rightCount => {
    if (!ui.screens.quiz.classList.contains('active')) return 'Start a round first.';
    if (!Number.isInteger(rightCount) || rightCount < 0 || rightCount > QUESTIONS_PER_SESSION) {
      return `Pass a whole number from 0 to ${QUESTIONS_PER_SESSION}.`;
    }
    clearTimeout(state.pendingTimer);
    setLocked(true);
    state.results = Array.from({ length: QUESTIONS_PER_SESSION }, (_, i) => (i < rightCount ? 'right' : 'wrong'));
    showDone();
    return `Finished with ${rightCount} of ${QUESTIONS_PER_SESSION} right.`;
  };

  document.addEventListener('keydown', e => {
    if (!ui.screens.quiz.classList.contains('active')) return;
    if (/^\d$/.test(e.key)) pressKey(e.key);
    else if (e.key === 'Backspace') pressKey('back');
    else if (e.key === 'Enter') pressKey('go');
  });

  document.addEventListener('click', unlockAudio, true);
  document.addEventListener('keydown', unlockAudio, true);

  $('quit').addEventListener('click', goHome);
  $('again').addEventListener('click', () => startSession(state.level));
  $('home-btn').addEventListener('click', goHome);
  $('sound-toggle').addEventListener('click', toggleSound);
  $('sticker-book-btn').addEventListener('click', showStickerBook);
  $('sticker-total-btn').addEventListener('click', showStickerBook);
  $('book-back').addEventListener('click', goHome);
  $('activity-btn').addEventListener('click', showActivity);
  $('star-total-btn').addEventListener('click', showActivity);
  $('activity-back').addEventListener('click', goHome);

  renderHome();
  renderKeypad();
</script>
</body>
</html>
