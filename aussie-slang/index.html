<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#b45309">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --amber:#b45309;
  --amber-dark:#7c2d12;
  --amber-mid:#d97706;
  --amber-light:#fef3c7;
  --amber-pale:#fffbeb;
  --sand:#faf7f2;
  --surface:#fff;
  --text:#1c1917;
  --text-mid:#44403c;
  --text-light:#78716c;
  --border:#e7e5e4;
  --border-light:#f5f5f4;
  --radius:12px;
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--sand);
  color:var(--text-mid);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}

.hero{
  background:linear-gradient(135deg,var(--amber-dark) 0%,var(--amber) 60%,var(--amber-mid) 100%);
  color:#fff;
  padding:60px 20px 24px;
  text-align:center;
}
.hero h1{
  font-family:'DM Serif Display',serif;
  font-size:clamp(28px,6vw,40px);
  font-weight:400;
  line-height:1.2;
  margin-bottom:8px;
}
.hero p{
  font-size:15px;
  opacity:0.75;
  max-width:380px;
  margin:0 auto;
}

.controls{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--surface);
  border-bottom:1.5px solid var(--border);
  padding:12px 16px;
}
.search-wrap{
  max-width:560px;
  margin:0 auto 10px;
  position:relative;
}
.search-wrap svg{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  color:var(--text-light);
  pointer-events:none;
}
.search{
  width:100%;
  font-family:inherit;
  font-size:15px;
  padding:10px 14px 10px 38px;
  border:1.5px solid var(--border);
  border-radius:10px;
  background:var(--sand);
  color:var(--text);
  outline:none;
  transition:border-color 0.2s;
}
.search:focus{border-color:var(--amber);}
.search::placeholder{color:var(--text-light);}
.cat-bar{
  max-width:560px;
  margin:0 auto;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.cat-btn{
  font-family:inherit;
  font-size:12px;
  font-weight:500;
  padding:5px 12px;
  border-radius:20px;
  border:1.5px solid var(--border);
  background:var(--surface);
  color:var(--text-light);
  cursor:pointer;
  transition:all 0.15s;
  white-space:nowrap;
}
.cat-btn:hover{border-color:var(--amber);color:var(--amber);}
.cat-btn.active{
  background:var(--amber);
  border-color:var(--amber);
  color:#fff;
  font-weight:600;
}
.count{
  max-width:560px;
  margin:0 auto;
  font-size:12px;
  color:var(--text-light);
  padding-top:8px;
}

.content{
  max-width:560px;
  margin:0 auto;
  padding:12px 16px 80px;
}

.card{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:16px 18px;
  margin-bottom:10px;
  transition:border-color 0.15s;
}
.card:hover{border-color:#d6d3d1;}
.card-head{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:2px;
  flex-wrap:wrap;
}
.slang-word{
  font-family:'DM Serif Display',serif;
  font-size:20px;
  color:var(--text);
  line-height:1.3;
}
.pronunciation{
  font-size:13px;
  color:var(--amber);
  font-weight:500;
  font-style:italic;
}
.meaning{
  font-size:14px;
  color:var(--text-mid);
  margin-bottom:6px;
}
.example{
  font-size:13px;
  color:var(--text-light);
  font-style:italic;
  padding:8px 12px;
  background:var(--amber-pale);
  border-radius:8px;
  line-height:1.5;
}
.example::before{
  content:'\201C';
  font-weight:700;
  color:var(--amber-mid);
}
.example::after{
  content:'\201D';
  font-weight:700;
  color:var(--amber-mid);
}
.cat-tag{
  font-size:10px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--text-light);
  background:var(--border-light);
  padding:2px 8px;
  border-radius:10px;
  margin-left:auto;
}
.no-results{
  text-align:center;
  padding:40px 20px;
  color:var(--text-light);
  font-size:15px;
}
.no-results strong{color:var(--text-mid);}

@media(min-width:500px){
  .slang-word{font-size:22px;}
  .card{padding:18px 22px;}
}
</style>
</head>
<body>

<header class="hero">
  <h1>Aussie Slang</h1>
  <p>A Yank&rsquo;s guide to what Australians are actually saying</p>

<div class="controls">
  <div class="search-wrap">

    <input type="text" class="search" id="search" placeholder="Search slang, meaning, or example&hellip;" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="cat-bar" id="catBar"></div>
  <div class="count" id="count"></div>
</div>

<main class="content" id="list"></main>

<script>
var SLANG = [

  {w:"Chuck",p:"as written",m:"Throw",ex:"Chuck it over here",cat:"Actions"},
  {w:"Chuck a sickie",p:'"chuck a SIK-ee"',m:"Call in sick (usually when not actually sick)",ex:"Chucked a sickie to go surfing",cat:"Actions"},
  {w:"Chuck a U-ey",p:'"chuck a YOO-ee"',m:"Make a U-turn",ex:"Chuck a U-ey at the next lights",cat:"Actions"},
  {w:"Flat out",p:"as written",m:"Very busy",ex:"I’ve been flat out all week",cat:"Actions"},
  {w:"Having a yarn",p:"as written",m:"Having a chat",ex:"Come over for a yarn and a cuppa",cat:"Actions"},
  {w:"Having a whinge",p:'"having a WINJ"',m:"Complaining / whining",ex:"Stop having a whinge about it",cat:"Actions"},
  {w:"Give it a burl",p:'"give it a BERL"',m:"Give it a try",ex:"Never tried surfing? Give it a burl",cat:"Actions"},
  {w:"Rock up",p:"as written",m:"Show up / arrive (casually)",ex:"Just rock up whenever you’re ready",cat:"Actions"},
  {w:"Spit the dummy",p:"as written",m:"Throw a tantrum",ex:"He spat the dummy over the parking spot",cat:"Actions"},

  // Places
  {w:"The bush",p:"as written",m:"Rural areas / countryside",ex:"They live out in the bush",cat:"Places"},
  {w:"Outback",p:"as written",m:"Remote inland Australia",ex:"Way past the bush — proper outback",cat:"Places"},
  {w:"Woop Woop",p:'"woop-WOOP"',m:"Middle of nowhere",ex:"They live out in Woop Woop",cat:"Places"},
  {w:"Tassie",p:'"TAZ-ee"',m:"Tasmania",ex:"We’re heading to Tassie for a week",cat:"Places"},
  {w:"Brissy",p:'"BRIZ-ee"',m:"Brisbane",ex:"Got a flight to Brissy",cat:"Places"},

  {w:"Accadacca",p:'"AK-ah-DAK-ah"',m:"AC/DC (the band)",ex:"Peak Australian nicknaming",cat:"Everyday"},

var CATS = ["All","Greetings","Everyday","Things","Food & Drink","People","Reactions","Actions","Places"];
var activeCat = "All";
var searchTerm = "";

var catBar = document.getElementById('catBar');
var listEl = document.getElementById('list');
var countEl = document.getElementById('count');
var searchEl = document.getElementById('search');

CATS.forEach(function(c){
  var b = document.createElement('button');
  b.className = 'cat-btn' + (c === 'All' ? ' active' : '');
  b.textContent = c;
  b.addEventListener('click', function(){
    activeCat = c;
    catBar.querySelectorAll('.cat-btn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    render();
  });
  catBar.appendChild(b);
});

searchEl.addEventListener('input', function(){
  searchTerm = searchEl.value.toLowerCase().trim();
  render();
});

function render(){
  var filtered = SLANG.filter(function(s){
    if(activeCat !== 'All' && s.cat !== activeCat) return false;
    if(!searchTerm) return true;
    return (s.w.toLowerCase().indexOf(searchTerm) !== -1 ||
            s.m.toLowerCase().indexOf(searchTerm) !== -1 ||
            s.ex.toLowerCase().indexOf(searchTerm) !== -1 ||
            s.p.toLowerCase().indexOf(searchTerm) !== -1);
  });

  countEl.textContent = filtered.length + ' of ' + SLANG.length + ' entries';

  if(!filtered.length){
    listEl.innerHTML = '<div class="no-results"><strong>No results</strong><br>Try a different search or category</div>';
    return;
  }

  var html = '';
  filtered.forEach(function(s){
    html += '<div class="card">' +
      '<div class="card-head">' +
        '<span class="slang-word">' + esc(s.w) + '</span>' +
        '<span class="pronunciation">' + esc(s.p) + '</span>' +
        '<span class="cat-tag">' + esc(s.cat) + '</span>' +
      '</div>' +
      '<div class="meaning">' + esc(s.m) + '</div>' +
      '<div class="example">' + esc(s.ex) + '</div>' +
    '</div>';
  });
  listEl.innerHTML = html;
}

function esc(s){
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
