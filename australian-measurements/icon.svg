<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3d32"/>
      <stop offset="100%" stop-color="#2a8a73"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="0" fill="url(#bg)"/>
  <!-- Thermometer -->
  <g transform="translate(48, 28)">
    <rect x="10" y="0" width="14" height="95" rx="7" fill="rgba(255,255,255,0.25)"/>
    <circle cx="17" cy="108" r="18" fill="rgba(255,255,255,0.25)"/>
    <rect x="13" y="35" width="8" height="60" rx="4" fill="#e85d3a"/>
    <circle cx="17" cy="108" r="12" fill="#e85d3a"/>
    <!-- Tick marks -->
    <rect x="26" y="15" width="10" height="2.5" rx="1" fill="rgba(255,255,255,0.5)"/>
    <rect x="26" y="30" width="14" height="2.5" rx="1" fill="rgba(255,255,255,0.7)"/>
    <rect x="26" y="45" width="10" height="2.5" rx="1" fill="rgba(255,255,255,0.5)"/>
    <rect x="26" y="60" width="14" height="2.5" rx="1" fill="rgba(255,255,255,0.7)"/>
    <rect x="26" y="75" width="10" height="2.5" rx="1" fill="rgba(255,255,255,0.5)"/>
  </g>
  <!-- Ruler -->
  <g transform="translate(95, 30)">
    <rect x="0" y="0" width="38" height="120" rx="5" fill="rgba(255,255,255,0.2)"/>
    <!-- cm marks -->
    <rect x="0" y="15" width="12" height="2" rx="1" fill="rgba(255,255,255,0.6)"/>
    <rect x="0" y="30" width="18" height="2.5" rx="1" fill="rgba(255,255,255,0.8)"/>
    <rect x="0" y="45" width="12" height="2" rx="1" fill="rgba(255,255,255,0.6)"/>
    <rect x="0" y="60" width="18" height="2.5" rx="1" fill="rgba(255,255,255,0.8)"/>
    <rect x="0" y="75" width="12" height="2" rx="1" fill="rgba(255,255,255,0.6)"/>
    <rect x="0" y="90" width="18" height="2.5" rx="1" fill="rgba(255,255,255,0.8)"/>
    <rect x="0" y="105" width="12" height="2" rx="1" fill="rgba(255,255,255,0.6)"/>
    <!-- cm label -->
    <text x="19" y="136" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">cm</text>
  </g>
  <!-- C and F labels -->
  <text x="37" y="168" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="rgba(255,255,255,0.85)">&deg;C</text>
  <text x="100" y="168" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.4)">&deg;F</text>
</svg>
